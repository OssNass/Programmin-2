name: Build Slidev lectures (HTML + PDF), deploy Pages, and upload artifacts

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: |
          if [ -f "package.json" ]; then
            pnpm install
          fi
          # Install isolated dependencies inside the custom theme directory
          cd slidev-theme-penguin-rtl && pnpm install && cd ..

      - name: Install Slidev CLI
        run: pnpm add -D @slidev/cli

      - name: Install Playwright dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          pnpm exec playwright install chromium
          pnpm exec playwright install-deps chromium

      - name: Build HTML and export PDFs
        run: |
          mkdir -p dist
          mkdir -p dist/pdf
          mkdir -p pdf

          # ----------------------------------------------------------------
          # PLAYWRIGHT BUG WORKAROUND:
          # Create and export a dummy file first to absorb the blank PDF bug.
          # ----------------------------------------------------------------
          echo -e "---\ntheme: ./slidev-theme-penguin-rtl\n---\n# Warmup" > dummy-warmup.md
          pnpm exec slidev export dummy-warmup.md --output dummy.pdf || true
          rm dummy-warmup.md dummy.pdf

          # ----------------------------------------------------------------
          # PROCESS ACTUAL LECTURES
          # ----------------------------------------------------------------
          for file in Lecture*.md; do
            [ -f "$file" ] || continue
            name=$(basename "$file" .md)

            echo "Building HTML for $file"
            pnpm exec slidev build "$file" \
              --theme ./slidev-theme-penguin-rtl \
              --out "dist/$name" \
              --base "/${{ github.event.repository.name }}/$name/"

            echo "Exporting PDF for $file"
            pnpm exec slidev export "$file" \
              --theme ./slidev-theme-penguin-rtl \
              --clicks \
              --output "pdf/$name.pdf"

            # Copy PDF to dist for GitHub Pages
            cp "pdf/$name.pdf" "dist/pdf/$name.pdf"
          done

      - name: Generate index.html
        run: |
          cat > dist/index.html << 'EOF'
          <!DOCTYPE html>
          <html dir="rtl">
          <head>
            <meta charset="UTF-8" />
            <title>Lectures</title>
            <style>
              body { font-family: sans-serif; margin: 40px; line-height: 1.6; text-align: right; background-color: #f9f9f9; color: #333; }
              ul { list-style-type: none; padding: 0; }
              li { margin-bottom: 12px; padding: 8px; border-bottom: 1px solid #ddd; }
              a { text-decoration: none; color: #0066cc; font-weight: bold; margin-left: 10px; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>المحاضرات الدراسية / Available Lectures</h1>
            <ul>
          EOF

          for dir in dist/*/; do
            name=$(basename "$dir")

            # Skip pdf folder from iteration listing
            if [ "$name" = "pdf" ]; then
              continue
            fi

            echo "              <li>" >> dist/index.html
            echo "                <a href=\"./$name/\">$name (HTML)</a> | " >> dist/index.html
            echo "                <a href=\"./pdf/$name.pdf\" download>تحميل PDF (Download)</a>" >> dist/index.html
            echo "              </li>" >> dist/index.html
          done

          cat >> dist/index.html << 'EOF'
            </ul>
          </body>
          </html>
          EOF

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slidev-pdfs
          path: pdf

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
